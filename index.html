const POOL=[0,1,2,3].map(()=>{const a=new Audio(CLIP);a.preload='auto';a.setAttribute('playsinline','');return a;});
const QUIET=[0,1].map(()=>{const a=new Audio(CLIP);a.preload='auto';a.setAttribute('playsinline','');a.volume=.25;return a;});
const ALL=[...POOL,...QUIET];let rr_i=0;const MAX_AT_ONCE=2;
function unlock(){ // must run synchronously inside a touch/click handler
 if(!unlocked){unlocked=true;for(const a of ALL){a.dataset.u='1';a.muted=true;const p=a.play();const done=()=>{if(!a.dataset.keep){a.pause();a.currentTime=0;}a.muted=false;a.dataset.u='';a.dataset.keep='';};if(p&&p.then)p.then(done,done);else done();}}
 try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
   fetch(CLIP).then(r=>r.arrayBuffer()).then(ab=>new Promise((ok,no)=>AC.decodeAudioData(ab,ok,no))).then(b=>{clipBuf=b;}).catch(()=>{});}
  if(AC.state!=='running')AC.resume();const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(master);s.start(0);}catch(e){}}
let webPlaying=0;
function webClip(vol){if(!AC||!clipBuf)return false;try{const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=vol;s.buffer=clipBuf;s.connect(g);g.connect(master);webPlaying++;s.onended=()=>{webPlaying--;};s.start();return true;}catch(e){return false;}}
const playing=a=>!a.paused&&!a.ended&&(!a.dataset.u||a.dataset.keep);
function playEl(list){for(let k=0;k<list.length;k++){const a=list[(rr_i+k)%list.length];if(playing(a)||a.dataset.keep)continue;rr_i++;try{if(a.dataset.u){a.dataset.keep='1';a.muted=false;}a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{});return true;}catch(e){}}return false;}
function bok(pitch=1,quiet=false){if(muted)return;
 if(POOL.filter(playing).length+webPlaying>=MAX_AT_ONCE)return; // avoid a pile-up of whole samples
 if(quiet){if(!webClip(.22))playEl(QUIET);return;} // Web Audio gain for a truly quiet hint (iOS ignores Audio.volume)
 if(!playEl(POOL))webClip(.9);}

 if(!clouds.length)for(let i=0;i<5;i++)clouds.push({x:Math.random()*W,y:30+Math.random()*H*.18,s:.6+Math.random()*.7,v:6+Math.random()*10});}
function mkBots(){bots=[];const n=12;for(let i=0;i<n;i++)bots.push({i,color:COLORS[i%COLORS.length],x:W/2+(Math.random()-.5)*W*.6,y:H*.62+(Math.random()-.5)*H*.2,tx:0,ty:0,

function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}

 cx.fillStyle='rgba(255,255,255,.12)';for(let i=0;i<40;i++){const x=(i*97)%W,y=H*.33+((i*53)%100)/100*H*.65;cx.fillRect(x,y,2,6);}

 if(sp.kind==='bush'){for(const [dx,dy,r,c] of [[-30,-22,26,'#2f9e44'],[30,-22,26,'#2f9e44'],[0,-38,32,'#37b24d'],[-14,-18,26,'#40c057'],[16,-18,26,'#40c057']]){cx.fillStyle=c;cx.beginPath();cx.arc(dx,dy,r,0,7);cx.fill();}
  cx.fillStyle='#ff6b6b';for(const [dx,dy] of [[-20,-40],[14,-52],[28,-26]]){cx.beginPath();cx.arc(dx,dy,4,0,7);cx.fill();}}
 else if(sp.kind==='box'){cx.fillStyle='#c98b4a';rr(-42,-70,84,70,6);cx.fill();cx.fillStyle='#b07535';cx.fillRect(-42,-70,84,12);cx.strokeStyle='#8a5a26';cx.lineWidth=3;cx.strokeRect(-42,-70,84,70);cx.fillStyle='#e8c690';cx.fillRect(-8,-70,16,70);

 cx.fillStyle='rgba(0,0,0,.18)';cx.beginPath();cx.ellipse(0,0,22,5,0,0,7);cx.fill();

 if(b.say>0){bubble(x,y-70*sc+bob*sc,'bok-bok!',Math.min(1,b.say*3));}}
function shade(h){const n=parseInt(h.slice(1),16);let r=(n>>16)*.7|0,g=((n>>8)&255)*.7|0,b=(n&255)*.7|0;return `rgb(${r},${g},${b})`;}
function bubble(x,y,txt,a,small){cx.save();cx.globalAlpha=a;cx.font=(small?'bold 12px':'bold 16px')+' -apple-system,sans-serif';const w=cx.measureText(txt).width+18,h=small?22:28;
 cx.fillStyle='#fff';rr(x-w/2,y-h,w,h,12);cx.fill();cx.beginPath();cx.moveTo(x-6,y-1);cx.lineTo(x,y+8);cx.lineTo(x+6,y-1);cx.fill();
 cx.fillStyle='#e8590c';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(txt,x,y-h/2);cx.restore();}
// ---------- game logic ----------
let hints=[]; // {sp,t}
function newRound(){mkBots();spots.forEach(s=>{s.bots=[];s.shake=0});foundN=0;confetti=[];hints=[];
 const seeker=bots[0];seeker.x=W/2;seeker.y=H*.36;seeker.state='count';
 const hiders=bots.slice(1);const order=[...spots.keys()].sort(()=>Math.random()-.5);
 hiders.forEach((b,k)=>{const sp=spots[order[k%spots.length]];sp.bots.push(b);b.spot=sp;b.state='run';b.peek=Math.random()<.35;
  b.tx=sp.x+(Math.random()-.5)*30*sp.s;b.ty=sp.y-6*sp.s;b.x=W/2+(Math.random()-.5)*120;b.y=H*.5+(Math.random()-.5)*60;b.speed=120+Math.random()*90;});
 state='count';stateT=0;elapsed=0;updHUD();document.getElementById('hud').classList.remove('hidden');}
function updHUD(){document.getElementById('found').textContent=`Found ${foundN}/${bots.length-1}`;document.getElementById('time').textContent=(state==='count'?'Ready…':elapsed.toFixed(1)+'s');}
function tap(px,py){if(state!=='play')return;let best=null,bd=1e9;
 for(const sp of spots){const r=60*sp.s,cy=sp.y-40*sp.s,d=Math.hypot(px-sp.x,py-cy);if(d<r*1.25&&d<bd){bd=d;best=sp;}}
 if(!best){blip(200,.05);return;}
 const left=best.bots.filter(b=>!b.found);
 if(!left.length){best.shake=.4;blip(160,.15,'sawtooth',.08);floaters.push({x:best.x,y:best.y-90*best.s,t:1,txt:'nobody here!'});return;}
 for(const b of left){b.found=true;b.state='found';b.pop=0;b.say=1.4;b.x=best.x+(Math.random()-.5)*60*best.s;b.y=best.y+14*best.s;foundN++;const k=left.indexOf(b);if(k===0)bok(b.pitch);else setTimeout(()=>bok(b.pitch),k*433);}
 best.shake=.3;burst(best.x,best.y-40*best.s,18);updHUD();
 if(foundN>=bots.length-1)setTimeout(win,900);}
let floaters=[];
function burst(x,y,n){for(let i=0;i<n;i++)confetti.push({x,y,vx:(Math.random()-.5)*300,vy:-Math.random()*350-80,c:COLORS[i%COLORS.length],r:Math.random()*6,life:1.6});}
function win(){state='win';stateT=0;bots.forEach((b,i)=>{b.found=true;b.say=1.2;b.x=W*.12+(i%6)*W*.152;b.y=H*.5+Math.floor(i/6)*H*.17;setTimeout(()=>bok(b.pitch),i*140);});
 for(let k=0;k<6;k++)setTimeout(()=>burst(Math.random()*W,H*.3,40),k*250);
 document.getElementById('wintxt').textContent=`All ${bots.length-1} bots found in ${elapsed.toFixed(1)} seconds. Bok-bok!`;
 setTimeout(()=>document.getElementById('win').classList.remove('hidden'),1800);}
let last=performance.now(),T=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;stateT+=dt;
 drawBG(T,dt);
 if(state==='menu'){for(const b of bots){if(!b.tx||Math.hypot(b.tx-b.x,b.ty-b.y)<5){b.tx=W*.1+Math.random()*W*.8;b.ty=H*.4+Math.random()*H*.5;}const a=Math.atan2(b.ty-b.y,b.tx-b.x);b.x+=Math.cos(a)*60*dt;b.y+=Math.sin(a)*60*dt;b.face=Math.cos(a)<0?-1:1;}}
 if(state==='count'||state==='play'){for(const b of bots){if(b.state==='run'){const dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy);if(d<4){b.state='hidden';}else{b.x+=dx/d*Math.min(d,b.speed*dt);b.y+=dy/d*Math.min(d,b.speed*dt);b.face=dx<0?-1:1;}}}
  if(state==='count'&&stateT>3.3){state='play';bots[0].state='seek';bots.forEach(b=>{if(b.state==='run'){b.x=b.tx;b.y=b.ty;b.state='hidden';}});startTime=now;}
  if(state==='play'){elapsed=(now-startTime)/1000;updHUD();
   if(T-lastHint>3.5+Math.random()*2){lastHint=T;const hid=bots.filter(b=>b.state==='hidden'&&!b.found);if(hid.length){const b=hid[Math.random()*hid.length|0];bok(b.pitch*1.15,true);b.spot.shake=.25;hints.push({x:b.spot.x,y:b.spot.y-110*b.spot.s,t:1.3});}}}}
 // draw sorted by y: spots and bots
 const items=[];for(const sp of spots)items.push({y:sp.y,f:()=>drawSpot(sp)});
 for(const b of bots){if(b.state==='hidden'&&!b.found){ if(b.peek){const sp=b.spot;items.push({y:sp.y-.5,f:()=>{cx.save();const pk=Math.sin(T*1.5+b.phase);const off=pk>.3?(b.i%2?-1:1)*48*sp.s:0;cx.translate(off,pk>.3?0:30*sp.s);
   cx.beginPath();cx.rect(sp.x-200,0,400,sp.y-40*sp.s+(pk>.3?40*sp.s:0));cx.clip();drawBot(b,T);cx.restore();}});}
   continue;}
  items.push({y:b.seeker&&state==="count"?1e6:b.y+(b.found?.1:0),f:()=>drawBot(b,T)});}
 items.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
 for(const sp of spots)sp.shake=Math.max(0,sp.shake-dt);
 for(const b of bots){if(b.say>0)b.say-=dt*.6;if(b.found)b.pop+=dt*2;}
 for(const h of hints){h.t-=dt;bubble(h.x,h.y-(1.3-h.t)*15,'bok…',Math.max(0,Math.min(1,h.t)),true);}hints=hints.filter(h=>h.t>0);
 for(const f of floaters){f.t-=dt;bubble(f.x,f.y,f.txt,Math.max(0,f.t),true);}floaters=floaters.filter(f=>f.t>0);
 for(const p of confetti){p.vy+=600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.r+=dt*8;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-4,-2,8,4);cx.restore();}confetti=confetti.filter(p=>p.life>0);
 if(state==='win'&&Math.random()<.15)burst(Math.random()*W,H*.25,6);
 if(state==='count'){const n=3-Math.floor(stateT);const s=bots[0];if(n>0){if(Math.floor(stateT)!==Math.floor(stateT-dt)||stateT<dt*1.5)blip(520+(3-n)*120,.15,'triangle',.25);
   cx.save();cx.font='900 80px -apple-system,sans-serif';cx.textAlign='center';cx.fillStyle='#fff';cx.strokeStyle='#2b3a7a';cx.lineWidth=8;const sc=1+(1-(stateT%1))*.4;cx.translate(W/2,H*.2);cx.scale(sc,sc);cx.strokeText(n,0,0);cx.fillText(n,0,0);cx.restore();
   bubble(s.x,s.y-75,'counting… eyes closed!',1,true);}
  else{bubble(s.x,s.y-75,'Ready or not!',1);}}
 requestAnimationFrame(frame);}
// ---------- input ----------
cv.addEventListener('touchend',e=>{e.preventDefault();unlock();for(const t of e.changedTouches)tap(t.clientX,t.clientY);},{passive:false});
cv.addEventListener('mousedown',e=>tap(e.clientX,e.clientY));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.getElementById('go').addEventListener('click',()=>{unlock();bok(1);document.getElementById('start').classList.add('hidden');newRound();});
document.getElementById('again').addEventListener('click',()=>{unlock();document.getElementById('win').classList.add('hidden');newRound();});
document.getElementById('test').addEventListener('click',()=>{unlock();bok(1);});
document.getElementById('mute').addEventListener('click',e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊';if(muted)ALL.forEach(a=>{if(!a.dataset.u)a.pause();});});
addEventListener('resize',resize);
document.addEventListener('touchend',()=>unlock(),{once:true,capture:true});
resize();mkBots();requestAnimationFrame(frame);
window.__game={get state(){return state},get bots(){return bots},get spots(){return spots},tap};
})();
</script></body></html>
